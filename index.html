<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integración de Sparky</title>
    <style>
        /* Reset básico */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenido de ejemplo para que veas cómo queda */
        .contenido-principal {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 600px;
        }

        .contenido-principal h1 {
            color: #333;
        }

        /* --- AQUÍ EMPIEZA EL CÓDIGO DE LA ESQUINA CON SPARKY --- */
        
        .esquina-sparky {
            /* Posición fija en la esquina inferior derecha */
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 9999;
            
            /* Diseño flexible para alinear la imagen y el texto */
            display: flex;
            flex-direction: row; /* Ponemos el texto al lado, o cambia a column si prefieres abajo */
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 16px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
            cursor: default;
        }

        /* Efecto al pasar el mouse */
        .esquina-sparky:hover {
            transform: scale(1.05);
        }

        /* Estilo del zorro */
        .esquina-sparky img {
            width: 70px; /* Ajusta este tamaño a tu gusto */
            height: auto;
            display: block;
            /* Si quieres que parezca un círculo, descomenta la línea de abajo */
            /* border-radius: 50%; */
        }

        /* Estilo del texto "Sparky" */
        .esquina-sparky .texto-sparky {
            font-family: 'Arial Black', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #2b6cb0; /* Un azul que combine con el zorro */
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
            line-height: 1;
        }

        /* Para móviles, hazlo un poco más pequeño */
        @media (max-width: 600px) {
            .esquina-sparky img {
                width: 50px;
            }
            .esquina-sparky .texto-sparky {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Contenido de la página de prueba -->
    <div class="contenido-principal">
        <h1>¡Bienvenido!</h1>
        <p>Este es un ejemplo de página. En la esquina inferior derecha verás a <strong>Sparky</strong> integrado con su texto.</p>
        <p>Puedes cambiar la posición en el CSS (bottom, left, right, top) o hacerlo responsive.</p>
    </div>

    <!-- --- COMPONENTE DE ESQUINA DE SPARKY --- -->
    <div class="esquina-sparky">
        <!-- 
            INSTRUCCIÓN IMPORTANTE: 
            Cambia el 'src' por la ubicación real de tu archivo PNG en tu proyecto.
            Si lo tienes en la misma carpeta, pon: src="nombre-del-zorro.png"
        -->
        <img src="https://via.placeholder.com/150x150/3b82f6/ffffff?text=ZORRO+PNG" alt="Zorro Sparky" id="logo-sparky">
        <span class="texto-sparky">Sparky</span>
    </div>

</body>
</html>
